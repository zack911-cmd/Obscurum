name: Build Desktop Installers

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  workflow_dispatch: {} # allows manually triggering a build from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false # if macOS fails, still let Linux/Windows finish
      matrix:
        include:
          - os: ubuntu-latest
            build-cmd: npm run build && npx electron-builder --linux --publish=never
            artifact-name: linux-installers
            artifact-path: release/*.deb release/*.AppImage
          - os: windows-latest
            build-cmd: npm run build && npx electron-builder --win --publish=never
            artifact-name: windows-installer
            artifact-path: release/*.exe
          - os: macos-latest
            build-cmd: npm run build && npx electron-builder --mac --publish=never
            artifact-name: macos-installer
            artifact-path: release/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: ${{ matrix.build-cmd }}
        # NOTE: without code-signing secrets configured (see comments below),
        # macOS and Windows builds will succeed but produce UNSIGNED installers.
        # That's fine for personal testing, not fine for public distribution
        # (see Gatekeeper/SmartScreen warnings discussed earlier).

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Optional: only runs when you push a version tag (e.g. `git tag v1.0.0`),
  # collects all three platform builds into a single GitHub Release.
  # -----------------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          draft: true # review before publishing, doesn't go live automatically
